    <meta name="theme-color" content="#0a0a0b" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
      }
      html, body {
        background-color: #0a0a0b !important;
        color: #f4f4f5;
      }
    </style>
    <script>
      (function() {
        document.documentElement.classList.add('dark');
        document.documentElement.setAttribute('data-theme', 'dark');
        // Progressive enhancement: only arm reveal animations when motion is
        // allowed. If this class is absent (JS off / reduced motion), every
        // section stays fully visible — content can never get stuck hidden.
        try {
          var mq = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)');
          if (!mq || !mq.matches) {
            document.documentElement.classList.add('reveal-ready');
          }
        } catch (e) {}
      })();
    </script>
